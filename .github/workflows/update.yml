name: 更新 dashboard

on:
  schedule:
    # GitHub 排程用 UTC（台灣時間 = UTC+8），實際執行常會晚 5~30 分鐘
    - cron: "20 1 * * 1-5"   # 台股開盤後 09:20
    - cron: "50 2 * * 1-5"   # 台股盤中 10:50
    - cron: "45 5 * * 1-5"   # 台股收盤後 13:45
    - cron: "50 14 * * 1-5"  # 美股開盤後（夏令 10:50 / 冬令 09:50 美東）
    - cron: "20 16 * * 1-5"  # 美股盤中
    - cron: "30 21 * * 1-5"  # 美股收盤後
  workflow_dispatch: {}      # 也可以在 Actions 頁面手動按「Run workflow」
  push:                      # 改了持倉、清單或設定就馬上更新（持倉頁存檔後約 2 分鐘出現新價格）
    branches: [main]
    paths: [holdings.json, watchlist.json, config.json, "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓資料、計算、推播
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python update.py
      - name: 儲存通知狀態與訊號紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新狀態 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
