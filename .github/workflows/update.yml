name: 更新 dashboard

on:
  schedule:
    # GitHub 排程用 UTC（台灣時間 = UTC+8），尖峰時常延遲甚至略過，所以多排幾次、避開整點
    # 台股（台灣時間 09:12、09:42、10:22、11:12、13:42、14:12）
    - cron: "12 1 * * 1-5"
    - cron: "42 1 * * 1-5"
    - cron: "22 2 * * 1-5"
    - cron: "12 3 * * 1-5"
    - cron: "42 5 * * 1-5"
    - cron: "12 6 * * 1-5"
    # 美股（美東夏令 09:52 開盤後起，到收盤後；冬令各晚一小時）
    - cron: "52 13 * * 1-5"
    - cron: "32 14 * * 1-5"
    - cron: "22 15 * * 1-5"
    - cron: "42 16 * * 1-5"
    - cron: "12 18 * * 1-5"
    - cron: "22 20 * * 1-5"
    - cron: "12 21 * * 1-5"
    - cron: "12 22 * * 1-5"
  workflow_dispatch: {}      # 也可以在 Actions 頁面手動按「Run workflow」
  push:                      # 改了持倉、清單或設定就馬上更新（持倉頁存檔後約 2 分鐘出現新價格）
    branches: [main]
    paths: [holdings.json, watchlist.json, config.json, refresh.json, "site/**"]   # refresh.json：網頁「立即更新」按鈕

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 還原上次抓的資料（資料來源暫時失敗時當備份）
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: 抓資料、計算、推播
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python update.py
      - name: 儲存通知狀態與訊號紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ watchlist.json
          git diff --cached --quiet || git commit -m "更新狀態 $(TZ=Asia/Taipei date '+%F %H:%M')"
          # 兩次更新幾乎同時完成時，state 檔可能衝突：以這次（較新）的內容為準，最多重試 3 次
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
