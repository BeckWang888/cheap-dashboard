<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>量化左側交易 Dashboard</title>
<meta name="theme-color" content="#12805f">
<style>
:root{
  --bg:#eef1f4;--panel:#fff;--ink:#1b2430;--sub:#5d6978;--line:#d9dfe6;
  --hot:#c2452d;--warm:#e0a24a;--mid:#c9d0d8;--cool:#6fb79c;--cheap:#12805f;
  --accent:#12805f;--chip:#e3e8ee;--gold:#b7791f;--goldbg:#fdf3dc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161d;--panel:#18202a;--ink:#e6ebf1;--sub:#93a0af;--line:#2a3441;--hot:#e0644a;--warm:#d9a04c;--mid:#3a4553;--cool:#4fa88a;--cheap:#3ec9a0;--accent:#3ec9a0;--chip:#232d3a}
}
:root[data-theme="dark"]{--bg:#10161d;--panel:#18202a;--ink:#e6ebf1;--sub:#93a0af;--line:#2a3441;--hot:#e0644a;--warm:#d9a04c;--mid:#3a4553;--cool:#4fa88a;--cheap:#3ec9a0;--accent:#3ec9a0;--chip:#232d3a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:0 0 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sum{display:flex;gap:6px 8px;flex-wrap:wrap;margin:6px 0 16px}
.sum button{font:inherit;text-align:left;border:1px solid transparent;background:none;color:var(--ink);border-radius:10px;padding:4px 8px;cursor:pointer}
.sum button:hover{background:var(--chip)}
.sum button[aria-pressed="true"]{background:var(--panel);border-color:var(--ink)}
.sum button[disabled]{cursor:default;opacity:.55}.sum button[disabled]:hover{background:none}
.sum b{font-size:28px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.sum span{font-size:13px;color:var(--sub)}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;margin:0 0 8px;border-radius:8px;background:var(--chip);font-size:14px}
.bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600}
label.t{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
button:focus-visible,label.t:focus-within,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert{border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:14px;background:var(--chip);border-left:4px solid var(--warm)}
.alert.err{border-left-color:var(--hot)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:12px 0 4px}
.legend.d{display:none}
@media(min-width:640px){.legend.d{display:grid;grid-template-columns:200px 1fr 120px;gap:16px;padding:0 16px}.legend.d span:nth-child(2){display:flex;justify-content:space-between}.legend.m{display:none}}
.list{background:var(--panel);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.id b{font-size:17px}.id .nm{font-size:13px;color:var(--sub);margin-left:8px}
.sc{text-align:right;font-variant-numeric:tabular-nums}
.sc b{font-size:22px}.sc span{display:block;font-size:12px;font-weight:600}
.th{grid-column:1/-1;position:relative;height:10px;border-radius:5px;margin:6px 0 2px;background:linear-gradient(90deg,var(--hot),var(--warm) 25%,var(--mid) 50%,var(--cool) 75%,var(--cheap))}
.th i{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--panel);opacity:.9}
.th u{position:absolute;top:-6px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ink);border:2px solid var(--panel);box-sizing:content-box;transform:translateX(-2px)}
.det{grid-column:1/-1;display:none;padding-top:8px;cursor:default}
.row.open .det{display:block}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.kv b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.det h4{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.fl{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);margin:0 4px 4px 0;font-size:12px}
.fl.on{background:var(--accent);color:var(--bg);font-weight:600}
.fl.bsf.on{background:var(--warm);color:#1b2430}
.fl.half{outline:1.5px dashed var(--warm);outline-offset:-1.5px}
.empty{padding:28px 16px;color:var(--sub);text-align:center}
@media(min-width:640px){
  .row{grid-template-columns:200px 1fr 120px;align-items:center}
  .th{grid-column:auto;margin:0;order:2}.sc{order:3}.det{order:4}
  .id .nm{display:block;margin:0}
}
.sig{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.dt{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sub);display:inline-block;margin-right:3px}
.dt.on{background:var(--accent);border-color:var(--accent)}
.dt.bs{border-radius:2px;transform:rotate(45deg);margin-left:6px;border-color:var(--warm)}.dt.bs.on{background:var(--warm)}
.dt.bs.half{background:linear-gradient(135deg,var(--warm) 50%,transparent 50%)}
.sig em{font-style:normal;font-size:12px;font-weight:600;color:var(--sub)}
.sig em.go{color:var(--accent)}.sig em.mid{color:var(--warm)}.sig em.off{font-weight:400}.sig em.boss{color:var(--warm)}
.row.go{box-shadow:inset 3px 0 0 var(--accent)}.row.boss{box-shadow:inset 3px 0 0 var(--warm)}
.lv{font-size:12px;color:var(--warm);margin-top:2px}.lv.warn{color:var(--hot)}
.hot{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:2px;color:#fff;background:var(--warm)}
.hot.vh{background:var(--hot)}
.live{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--sub)}
.px{font-size:13px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.px b{color:var(--ink);font-weight:600;margin-right:6px}
.sec{padding:10px 16px;font-size:13px;background:var(--chip);color:var(--sub);border-top:1px solid var(--line)}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
td,th{padding:4px 6px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{color:var(--sub);font-weight:600;border-top:0}td:first-child,th:first-child{text-align:left}
.scroll{overflow-x:auto}
.pos{color:var(--cheap)}.neg{color:var(--hot)}.dim{color:var(--sub)}
.kc .ktabs{margin:2px 0 6px}.kc .ktabs button{padding:5px 12px}
.klg{font-size:12px;font-variant-numeric:tabular-nums;min-height:36px;line-height:1.5}
.kbox{position:relative;width:100%}
.knote{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.kl{display:inline-block;width:12px;height:2px;vertical-align:3px;margin-right:4px}
.kz{display:inline-block;width:10px;height:10px;background:color-mix(in srgb,var(--gold) 25%,transparent);vertical-align:-1px;margin-right:4px}
.pin{border:0;background:none;font:inherit;font-size:17px;line-height:1;color:var(--sub);cursor:pointer;padding:2px 6px 2px 0;vertical-align:0}
.pin[aria-pressed="true"]{color:var(--gold)}
.sc .wr{font-size:12px;font-weight:400;color:var(--sub);white-space:nowrap}
.sc .wr.ok{color:var(--accent);font-weight:600}
.wrt td:nth-child(n+2),.wrt th:nth-child(n+2){text-align:right}
.wrt .wg{color:var(--accent);font-weight:600}.wrt .wb{color:var(--warm);font-weight:600}
.wrv{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--chip);border-left:4px solid var(--cnull)}
.wrv.ok{border-left-color:var(--accent)}.wrv.mid{border-left-color:var(--warm)}
.nav{display:flex;gap:4px;margin:4px 0 14px;border-bottom:1px solid var(--line)}
.nav a{padding:8px 14px;font-size:15px;color:var(--sub);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.card h3{font-size:16px;margin:0 0 6px}
.card summary{cursor:pointer;font-size:15px}
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:4px 0 8px}
.hsum span{display:block;font-size:13px;color:var(--sub)}
.hsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.25}
.hsum i{font-style:normal;font-size:13px}
.hsum .big{grid-column:1/-1}.hsum .big b{font-size:32px}
.hrow{grid-template-columns:1fr auto}
.hv{text-align:right;font-variant-numeric:tabular-nums}.hv b{display:block;font-size:17px}.hv span{font-size:12px;color:var(--sub)}
@media(min-width:640px){.hrow{grid-template-columns:200px 1fr 120px}.hv{order:2}.hrow .sc{order:3}}
.hrow .sc{display:none}@media(min-width:640px){.hrow .sc{display:block}}
.ht td,.ht th{font-size:13px}.ht .prow{cursor:pointer}.ht .prow:hover td{background:var(--chip)}
.ht tr.lots td{background:var(--chip);text-align:left}
.lot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:3px 0;font-variant-numeric:tabular-nums}
.ht.edit td{text-align:left}.ht.edit tr.warn td{background:color-mix(in srgb,var(--hot) 10%,transparent)}
.ht input,.ht select,#hin,#htok{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.ht input{width:100%;min-width:64px}
#hin{width:100%;resize:vertical;line-height:1.5}
.btn{font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:400}.btn[disabled]{opacity:.6}
.lk{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px}.lk.danger{color:var(--hot);font-weight:600}
.card a{color:var(--accent)}
.wl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wl li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.wl li:first-child{border-top:0}
.dh{cursor:grab;color:var(--sub);font-size:16px;padding:2px 8px 2px 0;touch-action:none;user-select:none;vertical-align:1px}
.row.sortable-ghost{opacity:.4}
.wl .hd{cursor:grab;font-size:18px;color:var(--sub);padding:4px 6px;touch-action:none;user-select:none}
.wl .ws{min-width:64px}.wl .wt{font-size:12px;color:var(--sub)}
.wl input,.wadd input,.wadd select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
.wl input{flex:1 1 120px}.wl input.wg{flex:0 1 110px}
.wl .sortable-ghost{opacity:.4}
.wadd{display:flex;gap:8px;flex-wrap:wrap}.wadd input{flex:1 1 140px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.sgrid input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.tg:first-of-type{border-top:0}.tg input{margin-top:4px}.tg b{display:block;font-size:14px;font-weight:600}.tg .dim{font-size:12px}
#mkt summary{cursor:pointer;font-size:15px}#mkt summary .chip{margin-left:8px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--sub)}
.chip.hot{background:var(--warm);color:#1b2430}.chip.vhot{background:var(--hot);color:#fff}
.mi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.mi:first-of-type{border-top:0}.mi .bar2{grid-column:1/-1;height:6px;border-radius:3px;background:var(--chip);position:relative;overflow:hidden}
.mi .bar2 i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mid),var(--warm) 80%,var(--hot))}
.mi .bt{grid-column:1/-1;font-size:12px;color:var(--sub)}.mi .v{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#e6b450;--goldbg:#3a2f17}}
:root[data-theme="dark"]{--gold:#e6b450;--goldbg:#3a2f17}
.row.sweet{box-shadow:inset 0 0 0 2px var(--gold);background:var(--goldbg)}
.sw{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:8px;margin-left:6px;vertical-align:2px;background:var(--gold);color:#fff}
.swbox{border:1px solid var(--gold);background:var(--goldbg);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.swbox b.t{color:var(--gold)}
/* 圖表分類色（固定順序，色盲友善驗證過的 8 色）＋中性灰 */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;--cnull:#9aa3ad;--cnull2:#c9d0d8;--up:var(--hot);--down:var(--cheap)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cnull:#6b7682;--cnull2:#46515e}}
:root[data-theme="dark"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--cnull:#6b7682;--cnull2:#46515e}
:root[data-updn="us"]{--up:var(--cheap);--down:var(--hot)}
.pos{color:var(--up)}.neg{color:var(--down)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:4px 0 6px}
.hero .hb{display:block;font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.hero2{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.hbar{height:12px;border-radius:6px;background:var(--cnull);margin:12px 0 6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--c1);border-right:2px solid var(--panel)}
.hbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.ctabs{display:flex;flex-wrap:wrap;width:100%}.ctabs button{flex:1 1 auto}
.dnw{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.dn{width:180px;max-width:46%;flex:0 0 auto;height:auto}
.dn-t{font-size:12px;fill:var(--sub)}.dn-v{font-size:19px;font-weight:700;fill:var(--ink)}
.lg{list-style:none;margin:0;padding:0;flex:1 1 200px;min-width:0;display:grid;gap:6px}
.lg li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.lg li i{width:12px;height:12px;border-radius:3px}.lg .dim{font-size:12px;min-width:56px;text-align:right}
.topb{display:grid;gap:7px}
.tb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.tbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbbar{position:relative;height:12px;background:var(--chip);border-radius:6px}
.tbbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.tbbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hot)}
.tbv{text-align:right;font-variant-numeric:tabular-nums}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.hd2 h3{margin:0}
.pl{display:grid;gap:5px}
.plr{display:grid;grid-template-columns:72px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.pln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plbar{position:relative;height:14px}
.plbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.plbar i.up{background:var(--up)}.plbar i.dn2{background:var(--down)}
.plbar em{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--sub);opacity:.5}
.plv{text-align:right;font-variant-numeric:tabular-nums}
.plgap{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.adv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adv li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--chip);border-left:4px solid var(--cnull)}
.adv li b{display:block;font-size:14px}.adv li .dim{font-size:13px}
.adv .ab{flex:0 0 auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;color:#fff;background:var(--cnull);margin-top:2px}
.adv li.warn{border-left-color:#d03b3b}.adv li.warn .ab{background:#d03b3b}
.adv li.caution{border-left-color:#fab219}.adv li.caution .ab{background:#fab219;color:#1b2430}
.adv li.chance{border-left-color:var(--gold)}.adv li.chance .ab{background:var(--gold)}
.pr{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.pr:first-child{border-top:0}
.pr1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.prn{min-width:0}.prv{font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .chip{margin-left:4px}.pr .sw{margin-left:4px}
.sw.up{background:var(--c1)}
.row.strong{box-shadow:inset 0 0 0 2px var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--panel))}
.sig em.strong{color:var(--c1)}
.swbox.up{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--panel))}.swbox.up b.t{color:var(--c1)}
.pr2{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px}
.wb{flex:0 0 120px;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.wb i{display:block;height:100%;background:var(--c1)}
.pr.on{background:color-mix(in srgb,var(--chip) 55%,transparent);margin:0 -16px;padding:10px 16px}
.pd{margin-top:10px;cursor:default}
.cp{margin:12px 0 4px}
.cpb{position:relative;height:10px;background:var(--chip);border-radius:5px}
.cpb i{position:absolute;top:0;bottom:0;border-radius:5px}.cpb i.up{background:var(--up)}.cpb i.dn2{background:var(--down)}
.cpb u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--sub);border-radius:2px}
.cpb u.now{background:var(--ink)}
.cpl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.pd-act{margin-top:6px}.lots2{margin-top:8px;display:grid;gap:2px}
@media(max-width:480px){.dn{max-width:100%;margin:0 auto}.wb{flex-basis:80px}}
.foot{font-size:12px;color:var(--sub);margin-top:18px}
.foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>量化左側交易 Dashboard</h1>
    <p class="note" id="meta">載入中…</p></div>

<script>
try{document.documentElement.setAttribute("data-updn",localStorage.getItem("cd_updn")==="us"?"us":"tw")}catch(e){}
var D=null,st={m:"all",only:false,cand:false,open:null,v:"full",sort:"custom",dir:-1,sum:null};
try{var ss=localStorage.getItem("cd_sort");if(/^(score|chg|wr)$/.test(ss))st.sort=ss;if(localStorage.getItem("cd_dir")==="1")st.dir=1}catch(e){}
// 釘選：存在這台裝置的瀏覽器裡，釘選的標的永遠排在最上面
var PINS=[];try{PINS=JSON.parse(localStorage.getItem("cd_pins")||"[]")||[]}catch(e){}
function pinned(s){return PINS.indexOf(s)>=0}
function togglePin(s){if(pinned(s))PINS=PINS.filter(function(x){return x!==s});else PINS.push(s);try{localStorage.setItem("cd_pins",JSON.stringify(PINS))}catch(e){}render()}
function WR(r){return r.v[st.v].wr}
try{var sv=localStorage.getItem("cd_v");if(sv==="5y"||sv==="full")st.v=sv}catch(e){}
var LV=[[80,"極便宜","--cheap"],[50,"很便宜","--cheap"],[20,"便宜","--cool"],[-10,"合理","--sub"],[-33,"小貴","--warm"],[-66,"中貴","--hot"],[-1e9,"很貴","--hot"]];
var BAND=[[80,"--cheap",1],[50,"--cheap",.65],[20,"--cool",1],[-10,"--mid",1],[-33,"--warm",1],[-66,"--hot",.6],[-1e9,"--hot",1]];
function lv(s){for(var i=0;i<LV.length;i++)if(s>=LV[i][0])return LV[i]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pc(x,d){if(x==null)return'—';if(Math.abs(x)<5e-4)x=0;var v=(x*100).toFixed(d==null?1:d);return'<span class="'+(x>0?"pos":x<0?"neg":"")+'">'+(x>0?"+":"")+v+'%</span>'}
function pp(x){return x==null?'—':(x*100).toFixed(0)+'%'}
function C(r){return r.v[st.v].current}
function stt(r){var c=C(r),n=c.sigs.filter(Boolean).length;if(c.score==null)return["資料不足","off"];
 if(c.state==="強勢谷底")return["強勢谷底"+(c.trough?"":"（形成中）"),"strong"];
 if(c.state==="未進便宜區")return["未進便宜區","off"];if(c.state==="轉折確認")return["轉折確認","go"];
 if(c.state==="重點觀察")return["重點觀察"+(c.trough?"":"（形成中）"),"boss"];if(c.state==="轉折初現")return["轉折初現（"+n+" 顆）","mid"];return["觀察中","wait"]}
var SUMF=[
 ["sweet","甜蜜點","--gold",function(r){return !!C(r).sweet}],
 ["go","候選進場","--accent",function(r){return stt(r)[1]==="go"}],
 ["strong","強勢谷底","--c1",function(r){return stt(r)[1]==="strong"}],
 ["boss","重點觀察","--warm",function(r){return stt(r)[1]==="boss"}],
 ["cheap","進入便宜區","",function(r){return C(r).score>=20}],
 ["pricey","中貴以上","--hot",function(r){return C(r).score!=null&&C(r).score<=-33}],
 ["heat","乖離過熱","--warm",function(r){return !!C(r).heat}]];
function setSum(k){st.sum=st.sum===k?null:k;render();if(st.sum)document.getElementById("fbar").scrollIntoView({block:"nearest",behavior:"smooth"})}
document.getElementById("sum").addEventListener("click",function(e){var b=e.target.closest("button");if(b&&!b.disabled)setSum(b.dataset.f)});
document.getElementById("fbar").addEventListener("click",function(e){if(e.target.closest("#fclr"))setSum(st.sum)});
function rank(r){var k=stt(r)[1];return C(r).sweet?3:k==="strong"||k==="go"?2:k==="boss"?1:0}
function isLev(r){return r.type==="leveraged"}
function render(){
 var items=D.items,cnt=function(f){return items.filter(f).length};
 // 上方統計可以點：只顯示那幾檔，再點一次（或按「顯示全部」）取消
 document.getElementById("sum").innerHTML=SUMF.map(function(f){var n=cnt(f[3]);
  return '<button data-f="'+f[0]+'" aria-pressed="'+(st.sum===f[0])+'"'+(n||st.sum===f[0]?'':' disabled')+'><b'+(f[2]?' style="color:var('+f[2]+')"':'')+'>'+n+'</b><span>'+f[1]+'</span></button>'}).join("");
 var sf=st.sum&&SUMF.filter(function(f){return f[0]===st.sum})[0];
 var rows=items.filter(function(r){var c=C(r);return(st.m==="all"||(st.m==="LEV"?isLev(r):r.market===st.m))&&(!st.only||c.score>=20)&&(!st.cand||rank(r)>0)&&(!sf||sf[3](r))})
  .map(function(r,i){return[r,i]}).sort(function(x,y){var a=x[0],b=y[0],pa=pinned(a.symbol),pb=pinned(b.symbol);
   if(pa!==pb)return pa?-1:1;
   var d=0;
   if(st.sort==="score")d=(isLev(a)?1:0)-(isLev(b)?1:0)||rank(b)-rank(a)||(C(b).score==null?-999:C(b).score)-(C(a).score==null?-999:C(a).score);
   else if(st.sort==="chg"){var ca=a.quote&&a.quote.chg,cb=b.quote&&b.quote.chg;d=(ca==null)-(cb==null)||(ca==null?0:st.dir*(ca-cb))}
   else if(st.sort==="wr"){var wa=WR(a),wb=WR(b);d=(!wa)-(!wb)||(wa?wb.p-wa.p:0)}
   return d||x[1]-y[1]}).map(function(x){return x[0]});
 var h="",seen=false;
 rows.forEach(function(r){
  var c=C(r),s=stt(r),L=r.lev,l=c.score==null?null:lv(c.score),p=c.score==null?50:(c.score+100)/2,pf=L?"標的 ":"";
  if(L&&!seen&&st.sort==="score"&&!pinned(r.symbol)){h+='<div class="sec">槓桿型 ETF：分數與訊號以對應的一倍標的計算，不代表槓桿產品本身安全</div>';seen=true}
  var dots="";c.sigs.forEach(function(v){dots+='<i class="dt'+(v?" on":"")+'"></i>'});
  dots+='<i class="dt bs'+(c.trough?" on":c.trough_forming?" half":"")+'" title="月線 MACD 谷底"></i>';
  var heat=c.heat?'<span class="hot'+(c.heat==="嚴重過熱"?" vh":"")+'">'+c.heat+'</span>':'';
  h+='<div class="row'+(c.sweet?" sweet":s[1]==="strong"?" strong":s[1]==="go"?" go":s[1]==="boss"?" boss":"")+(st.open===r.symbol?" open":"")+'" tabindex="0" data-t="'+esc(r.symbol)+'">'
   +'<div class="id">'+(canDrag()&&!pinned(r.symbol)?'<span class="dh" title="拖曳排序" aria-label="拖曳排序">☰</span>':'')+'<button class="pin" data-pin="'+esc(r.symbol)+'" aria-pressed="'+pinned(r.symbol)+'" title="'+(pinned(r.symbol)?'取消釘選':'釘選到最上面')+'" aria-label="釘選">'+(pinned(r.symbol)?'★':'☆')+'</button><b>'+esc(r.symbol.replace(".TW",""))+'</b>'+heat+(r.intraday?'<span class="live">盤中</span>':'')+'<span class="nm">'+esc(r.name)+'</span>'
   +pxLine(r)
   +(L?'<div class="lv">'+L.x+' 倍・對應 '+esc(L.underlying)+'</div>':'')+(r.thin?'<div class="lv warn">資料不足，分數僅供參考</div>':'')
   +'<div class="sig"><span>'+dots+'</span><em class="'+s[1]+'">'+s[0]+'</em>'+(c.sweet?'<span class="sw">甜蜜點</span>':'')+'</div></div>'
   +'<div class="sc"><b>'+(c.score==null?'—':c.score.toFixed(0))+'</b><span style="color:var('+(l?l[2]:'--sub')+')">'+(l?l[1]:'')+'</span>'+(WR(r)?'<span class="wr'+(wrOk(WR(r))?' ok':'')+'" title="回測勝率：歷史上同樣狀態買進，6 個月後上漲的機率；✓＝在便宜區，且 3 個月、6 個月、1 年都高於這檔平常">勝率 '+WR(r).p.toFixed(0)+'%'+(wrOk(WR(r))?' ✓':'')+'</span>':'')+'</div>'
   +'<div class="th">'+(D.thresholds||[20,50,80]).map(function(t){return'<i style="left:'+((t+100)/2)+'%"></i>'}).join("")+'<u style="left:'+p+'%"></u></div>'
   +(st.open===r.symbol?detail(r):'<div class="det"></div>')+'</div>';
 });
 document.getElementById("fbar").innerHTML=sf?'<div class="fbar"><span>只顯示：<b>'+sf[1]+'</b>（'+rows.length+' 檔）</span><button class="lk" id="fclr">顯示全部 ✕</button></div>':'';
 document.getElementById("list").innerHTML=h||'<div class="empty">沒有符合條件的標的。</div>';
 setupDrag();
 var kc=document.querySelector('.row.open .kc');
 if(kc){var r0=D.items.filter(function(r){return r.symbol===st.open})[0];
  KChart.mount(kc,{sym:r0.symbol,ver:D.generated,score:{d:r0.chart.d,s:r0.chart["s_"+st.v]},band:bandColor,
   title:r0.lev?'K 線是 '+esc(r0.symbol)+' 本身價格；分數色帶以 '+esc(r0.lev.underlying)+' 計算。':r0.base!==r0.symbol?'K 線與分數都以 '+esc(r0.base)+' 計算（本身沒有完整歷史價格）。':''})}
 else KChart.destroy();
}
function fmtPx(v){return v==null?'—':v>=1000?v.toLocaleString("en-US",{maximumFractionDigits:1}):v.toFixed(2)}
function pxLine(r){var q=r.quote;if(!q)return'';var d=q.date.slice(5).replace("-","/");
 return '<div class="px"><b>'+fmtPx(q.price)+'</b>'+(q.chg==null?'':pc(q.chg,2))+'<span class="dim">　'+d+(r.intraday?' 盤中':' 收盤')+'</span></div>'}
function detail(r){
 var c=C(r),L=r.lev,b=r.v[st.v].bt,pf=L?"標的 ":"",SN=D.signal_names;
 var h='<div class="det"><div class="kv"><div>'+pf+'距 52 週高點<b>'+pc(c.dd52)+'</b></div><div>'+pf+'距歷史高點<b>'+pc(c.dd_ath)+'</b></div><div>'+pf+'日線 RSI<b>'+(c.rsi==null?'—':c.rsi.toFixed(0))+'</b></div><div>'+pf+'相對 MA200<b>'+pc(c.ma_dev)+'</b></div><div>'+(r.intraday?'盤中價':'最新收盤')+'<b>'+fmtPx(r.price)+'</b></div><div>前一日收盤<b>'+fmtPx(r.quote&&r.quote.prev)+'</b></div></div>';
 if(L)h+='<h4>槓桿 ETF 本身</h4><div class="kv"><div>離高點<b>'+pc(L.dd_ath)+'</b></div><div>回本所需漲幅<b>'+pc(L.recover,0)+'</b></div><div>近一年實際 − 標的×'+L.x+'<b>'+(L.gap_1y==null?'不足 1 年':pc(L.gap_1y))+'</b></div></div>';
 var chips='<span class="fl bsf'+(c.trough?" on":"")+(c.trough_forming&&!c.trough?" half":"")+'">月線 MACD 谷底'+(c.trough?"（已確認）":c.trough_forming?"（形成中）":"")+'</span>';
 SN.forEach(function(n,k){chips+='<span class="fl'+(c.sigs[k]?" on":"")+(k===1&&!c.sigs[1]&&c.s2_forming?" half":"")+'">'+n+(k===1&&!c.sigs[1]&&c.s2_forming?"（形成中）":"")+'</span>'});
 h+='<h4>轉折訊號（'+c.sigs.filter(Boolean).length+' / 5）'+(r.intraday?'・盤中數值，收盤後才確定':'')+'</h4><div>'+chips+'</div>';
 if(c.heat)h+='<h4>過熱</h4><div class="kv"><div>'+c.heat+'：相對 MA200 的乖離已在自身歷史前 '+(c.heat==="嚴重過熱"?"1":"5")+'%（或 RSI ≥ 80）。回測顯示過熱後未必會跌，這是「別追高」的提醒，不是賣出訊號。</div></div>';
 h+=wrBox(r);
 h+='<h4>走勢圖</h4><div class="kc"></div>';
 if(stt(r)[1]==="strong"){var su=b.rows.filter(function(e){return e.label.indexOf("強勢谷底")===0})[0],b0=b.rows[0];
  h+='<div class="swbox up"><b class="t">強勢谷底'+(c.trough?'':'（形成中，月底收盤才確認）')+'：月線 MACD 谷底，價格仍在 200 日均線（年線）之上</b><br>'
   +'不在便宜區，代表這檔仍在多頭；回檔讓月線動能觸底、開始回升。所有標的回測（谷底確認當天買進）：6 個月上漲機率中位數比平常高約 8 個百分點，約 2/3 的標的優於平常，再跌也比跌破年線的谷底淺；但各檔差異大（例如 TSLA 反而較差），優勢也不如甜蜜點（便宜區＋谷底，約 +18）。'
   +(su&&su.n?'<br>這檔過去出現 '+su.n+' 次，之後 6 個月中位數 '+pc(su.r126)+'（任意日 '+pc(b0.r126)+'），上漲機率 '+pp(su.win126)+'（任意日 '+pp(b0.win126)+'）；期間通常再跌 '+pc(su.mae_med)+'。'+(su.n<5?' <b>樣本少於 5 次，參考就好。</b>':''):'')
   +'<br><span class="dim">不是不敗：月線谷底後 6 個月仍約有 3 成會下跌（例如 2008 年）。跌破年線的谷底沒有優勢。照分批規則進場。</span></div>'}
 if(c.sweet){var sw=b.rows.filter(function(e){return e.label==="進入甜蜜點"})[0],bs=b.rows[0];
  h+='<div class="swbox"><b class="t">甜蜜點：'+esc(c.sweet_why)+'</b><br>'
   +(sw&&sw.n?'這檔過去進入甜蜜點 '+sw.n+' 次，之後 6 個月中位數 '+pc(sw.r126)+'（任意日 '+pc(bs.r126)+'），上漲機率 '+pp(sw.win126)+'（任意日 '+pp(bs.win126)+'）；期間通常還會再跌 '+pc(sw.mae_med)+'，最糟 1 成再跌 '+pc(sw.mae_p10)+'。':'這檔過去樣本不足，參考整體回測：所有標的平均比任意日多約 6～9 個百分點。')
   +(sw&&sw.n&&sw.n<5?' <b>樣本少於 5 次，參考就好。</b>':'')
   +(r.type==="stock"?'<br>個股跌深有時是基本面出問題（例如財報、產業衰退），進場前先確認原因。':r.type==="leveraged"?'<br>槓桿 ETF 波動放大，分數以一倍標的計算，不代表槓桿產品本身安全。':'')
   +'<br><span class="dim">勝率較高不代表穩賺，照你的分批規則進場。</span></div>'}
 h+='<h4>回測摘要（'+(L?'報酬為模擬 '+L.x+' 倍、':'')+'有分數 '+b.years.toFixed(1)+' 年，6 個月中位數）</h4><div class="scroll"><table><tr><th>事件</th><th>次數</th><th>6 個月報酬</th><th>上漲機率</th><th>之後最大再跌</th></tr>';
 b.rows.forEach(function(e,i){h+='<tr'+(i?'':' class="dim"')+'><td>'+esc(e.label)+'</td><td>'+(i?e.n:'—')+'</td><td>'+pc(e.r126)+'</td><td>'+pp(e.win126)+'</td><td>'+pc(e.mae_med)+'</td></tr>'});
 var g=b.longest_gap;
 h+='</table></div><div class="kv" style="margin-top:6px"><div>便宜區時間占比<b>'+pp(b.cheap_share)+'</b></div><div>每年進便宜區<b>'+b.cheap_per_year.toFixed(1)+' 次</b></div><div>最長沒進便宜區<b>'+(g?g.years.toFixed(1)+' 年':'—')+'</b></div></div>';
 return h+'</div>';
}
function bandColor(v){for(var k=0;k<BAND.length;k++)if(v>=BAND[k][0])break;var c=getComputedStyle(document.documentElement).getPropertyValue(BAND[k][1]).trim(),m=/^#([0-9a-f]{6})$/i.exec(c);
 if(!m)return c;var n=parseInt(m[1],16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+BAND[k][2]+")"}
var CHEAP_ST={sweet:1,trough_up:1,cheap2:1,cheap:1};
// 打勾＝在便宜區（分數 ≥ 20）或強勢谷底，且 3 個月、6 個月、1 年勝率都高於這檔平常
function wrOk(w){return !!(w&&CHEAP_ST[w.state]&&w.n_h>0&&w.better===w.n_h)}
function wrBox(r){
 var w=WR(r);if(!w)return'<h4>回測勝率</h4><div class="kv"><div>歷史還不夠長（有分數後還要約 1 年半），暫不估計。</div></div>';
 var sg=function(x){return(x>0?"+":"")+x.toFixed(1)},H=[["3m","3 個月"],["6m","6 個月"],["1y","1 年"]];
 var t='<div class="scroll"><table class="wrt"><tr><th>買進後</th><th>這種狀態</th><th>這檔平常</th><th>差</th></tr>';
 H.forEach(function(x){var v=w[x[0]];if(!v)return;var d=v.p-v.base;
  t+='<tr><td>'+x[1]+'上漲機率</td><td><b>'+v.p.toFixed(0)+'%</b></td><td>'+v.base.toFixed(0)+'%</td><td class="'+(d>1?"wg":d<-1?"wb":"dim")+'">'+sg(d)+'</td></tr>'});
 var m=w.mae;
 if(m){var dm=m.p-m.base;t+='<tr><td>6 個月內通常再跌</td><td><b>'+m.p.toFixed(1)+'%</b></td><td>'+m.base.toFixed(1)+'%</td><td class="'+(dm>1?"wg":dm<-1?"wb":"dim")+'">'+sg(dm)+'</td></tr>'}
 t+='</table></div>';
 var n=w.n_h,v;
 if(w.better===n&&!CHEAP_ST[w.state])v=['mid',n+' 個期間勝率都高於平常，但目前不在便宜區也不是強勢谷底（'+esc(w.label)+'），多半是強勢延續；不算買點，追高要有心理準備。'];
 else if(w.better===n&&w.calm)v=['ok','✓ '+n+' 個期間都高於平常，買進後的再跌也不比平常深：歷史上相對安穩、勝率高的買點。'];
 else if(w.better===n)v=['ok','✓ '+n+' 個期間都高於平常，但買進後通常會比平常再多跌一些（'+m.p.toFixed(0)+'%）：勝率高但要忍波動，適合分批、別一次買滿。'];
 else if(w.better>0)v=['mid','只有 '+w.better+'／'+n+' 個期間高於平常，訊號不一致，參考就好。'];
 else v=['no',n+' 個期間都沒有高於平常，歷史上不是特別好的買點。'];
 return'<h4>回測勝率（目前狀態：'+esc(w.label)+'）</h4>'+t
  +'<div class="wrv '+v[0]+'">'+v[1]+'</div>'
  +'<div class="dim" style="font-size:12px;margin-top:4px">「這種狀態」＝歷史上同樣狀態買進的結果，綜合所有標的的共通規律與這檔自己的歷史'
  +(w.own_n?'（這檔自己約 '+w.own_n.toFixed(0)+' 個獨立樣本，占 '+(w.own_k*100).toFixed(0)+'%）':'（這檔自己沒出現過這種狀態）')+'。'
  +'勝率主要反映這檔的長期趨勢，所以看「差」比看絕對數字重要。過熱時勝率偏高是強勢延續＋清單多是存活下來的強勢股，不代表該追高。'+(r.lev?'槓桿 ETF 用模擬的 '+r.lev.x+' 倍報酬計算。':'')+'</div>';
}
function marketCard(){
 var M=D.market,box=document.getElementById("mkt");if(!M||!M.indicators||!M.indicators.length){box.hidden=true;return}
 box.hidden=false;var NM={US:"美股",TW:"台股"};
 var chips=Object.keys(M.summary).map(function(k){var s=M.summary[k];return'<span class="chip'+(s.hot>=2?" vhot":s.hot?" hot":"")+'">'+NM[k]+" "+s.hot+"/"+s.total+" 過熱</span>"}).join("");
 document.getElementById("mkt-sum").innerHTML="<b>市場溫度</b>"+chips;
 var f=function(x,fmt){return fmt==="pct"?(x>0?"+":"")+(x*100).toFixed(1)+"%":x.toFixed(1)};
 var h='<p class="note" style="margin:6px 0">每個指標和自己的歷史比，百分位越高越熱；前 10% 算過熱、前 3% 算嚴重過熱。下面的回測是「進入過熱後」大盤 6 個月的中位數報酬和基準比較：美股的過熱指標歷史上沒有預測力（強勢常延續），台股稍有參考價值。當作「別追高、別加碼」的提醒，不是賣出訊號。</p>';
 ["US","TW"].forEach(function(mk){M.indicators.filter(function(x){return x.market===mk}).forEach(function(x){
  var b=x.bt_hot,base=x.bt_base;
  h+='<div class="mi"><div><b>'+esc(x.name)+'</b> <span class="dim" style="font-size:12px">'+NM[mk]+'</span>'+(x.status?' <span class="chip'+(x.status==="嚴重過熱"?" vhot":" hot")+'">'+x.status+'</span>':'')+'</div>'
   +'<div class="v">'+f(x.value,x.fmt)+' <span class="dim" style="font-size:12px">前 '+Math.max(1,Math.round((1-x.heat)*100))+'%</span></div>'
   +'<div class="bar2"><i style="width:'+(x.heat*100).toFixed(0)+'%"></i></div>'
   +'<div class="bt">過熱後 6 個月：'+pc(b.r126)+'（上漲機率 '+pp(b.win126)+'，'+b.n+' 次）・任意日：'+pc(base.r126)+'（'+pp(base.win126)+'）・資料自 '+x.since.slice(0,4)+' 年</div></div>'})});
 document.getElementById("mkt-body").innerHTML=h;
}
function alerts(){
 var h="";Object.keys(D.groups||{}).forEach(function(g){var s=D.groups[g];if(s.length>=D.group_alert_min)h+='<div class="alert">'+esc(g)+' 有 '+s.length+' 檔同時在便宜區（'+s.map(esc).join("、")+'），分批時留意這一塊的總曝險。</div>'});
 if(D.failed&&D.failed.length)h+='<div class="alert err">這次更新抓不到：'+D.failed.map(esc).join("、")+'（沿用上次資料或未顯示）</div>';
 document.getElementById("alerts").innerHTML=h;
}
function setV(v){st.v=v;try{localStorage.setItem("cd_v",v)}catch(e){}[].forEach.call(document.getElementById("vt").children,function(x){x.setAttribute("aria-pressed",x.dataset.v===v)});render()}
document.getElementById("vt").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setV(b.dataset.v)});
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;st.m=b.dataset.m;[].forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x===b)});render()});
document.getElementById("only").addEventListener("change",function(){st.only=this.checked;render()});
document.getElementById("cand").addEventListener("change",function(){st.cand=this.checked;render()});
function setSort(v){st.sort=v;try{localStorage.setItem("cd_sort",v);localStorage.setItem("cd_dir",String(st.dir))}catch(e){}[].forEach.call(document.getElementById("sortt").children,function(x){x.setAttribute("aria-pressed",x.dataset.s===v);if(x.dataset.s==="chg")x.textContent="漲跌幅"+(v==="chg"?(st.dir<0?"↓":"↑"):"")});if(D)render()}
// 漲跌幅：再按一次切換「漲最多在上」／「跌最多在上」
document.getElementById("sortt").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.s==="chg"&&st.sort==="chg")st.dir=-st.dir;setSort(b.dataset.s)});
document.getElementById("wedit").addEventListener("click",function(){WL.open()});
// 清單存檔後：先照新順序排、移除刪掉的；新增的要等下一次更新才有分數
window.onWatchlistSaved=function(list){if(!D)return;var idx={};list.forEach(function(it,i){idx[it.symbol]=i});
 D.items=D.items.filter(function(r){return r.symbol in idx}).sort(function(a,b){return idx[a.symbol]-idx[b.symbol]});
 var added=list.filter(function(it){return !D.items.some(function(r){return r.symbol===it.symbol})}).length;
 setSort("custom");document.getElementById("alerts").insertAdjacentHTML("afterbegin",'<div class="alert">清單已儲存'+(added?'，新增的 '+added+' 檔約 2 分鐘後出現（重新整理頁面）':'')+'。</div>')};
// 主畫面直接拖曳排序：只有「自訂順序」且沒有篩選時才能拖，放開後存回 watchlist.json
var listSortable=null;
function canDrag(){return st.sort==="custom"&&st.m==="all"&&!st.only&&!st.cand&&!st.sum&&!!window.Sortable}
function setupDrag(){
 if(listSortable){listSortable.destroy();listSortable=null}
 if(!canDrag())return;
 listSortable=Sortable.create(document.getElementById("list"),{handle:".dh",draggable:".row",animation:150,forceFallback:true,fallbackTolerance:3,onEnd:function(ev){
  if(ev.oldIndex===ev.newIndex)return;
  // 釘選的標的固定在畫面最上面，但存回清單時維持它們原本的位置，只重排其他標的
  var moved=[].map.call(document.querySelectorAll("#list .row"),function(x){return x.dataset.t}).filter(function(s){return !pinned(s)}),k=0;
  var order=D.items.map(function(r){return pinned(r.symbol)?r.symbol:moved[k++]});
  var pos={};order.forEach(function(s,i){pos[s]=i});
  D.items.sort(function(a,b){return(pos[a.symbol]==null?999:pos[a.symbol])-(pos[b.symbol]==null?999:pos[b.symbol])});
  render();
  WL.saveOrder(order).then(function(msg){note(msg)},function(e){note(e.message,true)});
 }});
}
function note(msg,err){var a=document.getElementById("alerts");a.querySelectorAll(".alert.tmp").forEach(function(x){x.remove()});
 a.insertAdjacentHTML("afterbegin",'<div class="alert tmp'+(err?' err':'')+'">'+esc(msg)+'</div>');setTimeout(function(){a.querySelectorAll(".alert.tmp").forEach(function(x){x.remove()})},6000)}
function tog(e){var pb=e.target.closest(".pin");if(pb&&e.type==="click"){e.stopPropagation();togglePin(pb.dataset.pin);return}
 if(e.target.closest(".det")||e.target.closest(".dh")||pb)return;var r=e.target.closest(".row");if(!r)return;if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();st.open=st.open===r.dataset.t?null:r.dataset.t;render()}
document.getElementById("list").addEventListener("click",tog);
document.getElementById("list").addEventListener("keydown",tog);
function route(){var h=location.hash==="#holdings"?"holdings":location.hash==="#settings"?"settings":"cheap";
 document.getElementById("cheap").hidden=h!=="cheap";document.getElementById("holdings").hidden=h!=="holdings";document.getElementById("settings").hidden=h!=="settings";document.getElementById("vt").hidden=h!=="cheap";
 [].forEach.call(document.querySelectorAll(".nav a"),function(a){if(a.dataset.view===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 if(h==="holdings")Holdings.start();if(h==="settings")Settings.start()}
window.addEventListener("hashchange",route);route();
setSort(st.sort);
fetch("data.json?t="+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
 D=j;document.getElementById("meta").textContent="更新時間 "+j.generated+"（台灣時間）・台股盤中與收盤後、美股盤中與收盤後自動更新";
 alerts();marketCard();setV(st.v);
}).catch(function(e){document.getElementById("list").innerHTML='<div class="empty">資料載入失敗（'+esc(e.message)+'），請稍後重新整理。</div>'});
</script>
