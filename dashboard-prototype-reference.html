<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>便宜度 Dashboard（原型）</title>
<style>
:root{
  --bg:#eef1f4;--panel:#fff;--ink:#1b2430;--sub:#5d6978;--line:#d9dfe6;
  --hot:#c2452d;--warm:#e0a24a;--mid:#c9d0d8;--cool:#6fb79c;--cheap:#12805f;
  --accent:#12805f;--chip:#e3e8ee;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161d;--panel:#18202a;--ink:#e6ebf1;--sub:#93a0af;--line:#2a3441;--hot:#e0644a;--warm:#d9a04c;--mid:#3a4553;--cool:#4fa88a;--cheap:#3ec9a0;--accent:#3ec9a0;--chip:#232d3a}
}
:root[data-theme="dark"]{--bg:#10161d;--panel:#18202a;--ink:#e6ebf1;--sub:#93a0af;--line:#2a3441;--hot:#e0644a;--warm:#d9a04c;--mid:#3a4553;--cool:#4fa88a;--cheap:#3ec9a0;--accent:#3ec9a0;--chip:#232d3a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:0 0 16px}
.sum{display:flex;gap:20px;flex-wrap:wrap;margin:0 0 18px}
.sum b{font-size:30px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.sum span{font-size:13px;color:var(--sub)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600}
label.t{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
button:focus-visible,label.t:focus-within,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:14px 0 4px}
.legend.d{display:none}
@media(min-width:640px){.legend.d{display:grid;grid-template-columns:190px 1fr 120px;gap:16px;padding:0 4px}.legend.d span:nth-child(2){display:flex;justify-content:space-between}.legend.m{display:none}}
.list{background:var(--panel);border-radius:12px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.id b{font-size:17px}.id span{font-size:13px;color:var(--sub);margin-left:8px}
.sc{text-align:right;font-variant-numeric:tabular-nums}
.sc b{font-size:22px}.sc span{display:block;font-size:12px;font-weight:600}
.th{grid-column:1/-1;position:relative;height:10px;border-radius:5px;margin:6px 0 2px;background:linear-gradient(90deg,var(--hot),var(--warm) 25%,var(--mid) 50%,var(--cool) 75%,var(--cheap))}
.th i{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--panel);opacity:.9}
.th u{position:absolute;top:-6px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ink);border:2px solid var(--panel);box-sizing:content-box;transform:translateX(-2px)}
.det{grid-column:1/-1;display:none;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);padding-top:6px}
.row.open .det{display:flex}
.det b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.fl{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);margin-right:4px;font-size:12px}
.fl.on{background:var(--accent);color:var(--bg);font-weight:600}
.empty{padding:28px 16px;color:var(--sub);text-align:center}
@media(min-width:640px){
  .row{grid-template-columns:190px 1fr 120px;align-items:center}
  .th{grid-column:auto;margin:0}
  .id span{display:block;margin:0}
}
.sig{display:flex;align-items:center;gap:8px;margin-top:4px}
.dt{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sub);display:inline-block;margin-right:3px;box-sizing:border-box}
.dt.on{background:var(--accent);border-color:var(--accent)}
.sig em{font-style:normal;font-size:12px;font-weight:600;color:var(--sub)}
.sig em.go{color:var(--accent)}.sig em.mid{color:var(--warm)}.sig em.off{font-weight:400}
.row.go{box-shadow:inset 3px 0 0 var(--accent)}
.det .sg{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.dt.bs{border-radius:2px;transform:rotate(45deg);margin-left:6px;border-color:var(--warm)}.dt.bs.on{background:var(--warm)}
.sig em.boss{color:var(--warm)}.row.boss{box-shadow:inset 3px 0 0 var(--warm)}.fl.bsf.on{background:var(--warm);color:#1b2430}
.lv{font-size:12px;color:var(--warm);margin-top:2px}.lv.warn{color:var(--hot)}
.sec{padding:10px 16px;font-size:13px;background:var(--chip);color:var(--sub);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>便宜度 Dashboard</h1>
  <p class="note">原型 v5：加入槓桿型 ETF，分數以對應的一倍標的計算。所有數字都是示意資料，不是真實行情。點任一列可展開細節。</p>
  <div class="sum" id="sum"></div>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-m="all" aria-pressed="true">全部</button>
      <button data-m="US" aria-pressed="false">美股</button>
      <button data-m="TW" aria-pressed="false">台股</button>
      <button data-m="LEV" aria-pressed="false">槓桿</button>
    </div>
    <label class="t"><input type="checkbox" id="only"> 只看便宜區（20 分以上）</label>
    <label class="t"><input type="checkbox" id="cand"> 只看候選進場與重點觀察</label>
  </div>
  <div class="legend m"><span>很貴</span><span>合理</span><span>很便宜</span></div>
  <div class="legend d"><span>標的</span><span><span>很貴</span><span>中貴</span><span>合理</span><span>便宜（20 / 50 / 80 通知）</span><span>很便宜</span></span><span style="text-align:right">分數</span></div>
  <div class="list" id="list"></div>
</div>
<script>
var D=[
 ["VOO","標普 500 ETF","US",12,-3.1,58,6.2,[0,0,0,0,0]],
 ["QQQ","那斯達克 100 ETF","US",-35,-0.8,71,11.4,[0,0,0,0,1]],
 ["VTI","美國全市場 ETF","US",8,-4.4,55,4.9,[0,0,0,0,0]],
 ["SCHD","高股息 ETF","US",47,-14.2,38,-2.1,[1,0,1,1,1]],
 ["AAPL","蘋果","US",-62,-0.3,77,15.8,[0,0,0,0,1]],
 ["MSFT","微軟","US",26,-9.7,43,-1.3,[1,0,0,1,0]],
 ["TQQQ","三倍 那斯達克 100","US",-35,-0.8,71,11.4,[0,0,0,0,1]],
 ["SOXL","三倍 半導體","US",58,-22.4,36,-5.9,[1,1,0,1,0]],
 ["SNXX","兩倍 SNDK","US",41,-31.5,39,-8.2,[1,0,0,0,0]],
 ["GGLL","兩倍 GOOGL","US",22,-12.3,44,-1.8,[0,0,0,1,0]],
 ["0050","元大台灣50","TW",-18,-2.2,63,8.1,[0,0,0,0,0]],
 ["006208","富邦台50","TW",-14,-2.6,61,7.5,[0,0,0,0,0]],
 ["0056","元大高股息","TW",71,-19.5,31,-6.8,[0,0,0,0,0]],
 ["00878","國泰永續高股息","TW",33,-11.8,41,-3.4,[1,0,0,0,0]],
 ["2330","台積電","TW",-48,-0.6,74,13.9,[0,0,0,0,0]]
];
var SN=["日線 MACD 綠柱縮短","週線 MACD 綠柱縮短","RSI 回升","價格止穩","站回 20 日均線"];
function lv(s){
 if(s>=80)return["極便宜","var(--cheap)"];if(s>=50)return["很便宜","var(--cheap)"];if(s>=20)return["便宜","var(--cool)"];
 if(s>-10)return["合理","var(--sub)"];if(s>-33)return["小貴","var(--warm)"];if(s>-66)return["中貴","var(--hot)"];return["很貴","var(--hot)"];}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
var LEV={"TQQQ":{u:"QQQ",x:3,edd:-2.9,gap:3},"SOXL":{u:"SOXX",x:3,edd:-61,gap:-18},"SNXX":{u:"SNDK",x:2,edd:-72,gap:null,thin:1},"GGLL":{u:"GOOGL",x:2,edd:-38,gap:-7}};
function levBlock(k){var rc=Math.round((1/(1+k.edd/100)-1)*100);return '<div>槓桿 ETF 本身離高點<b>'+k.edd+'%</b></div><div>回本所需漲幅<b>+'+rc+'%</b></div><div>近一年實際對標的×'+k.x+'<b>'+(k.gap===null?"不足 1 年":(k.gap>0?"+":"")+k.gap+" 個百分點")+'</b></div>'}
var BOSS={"00878":2,"0056":1};var BN="月線 MACD 谷底出現";
function stt(r){var n=sum(r[7]);if(r[3]<20)return["未進便宜區","off"];if(n>=3&&(r[7][0]||r[7][1]))return["轉折確認","go"];if(BOSS[r[0]])return["重點觀察"+(BOSS[r[0]]===2?"（形成中）":""),"boss"];if(n>=1)return["轉折初現","mid"];return["觀察中","wait"];}
function cd(r){var k=stt(r)[1];return k==="go"||k==="boss"}
var st={m:"all",only:false,cand:false,open:null};
function render(){
 var rows=D.filter(function(r){return(st.m==="all"||(st.m==="LEV"?!!LEV[r[0]]:r[2]===st.m))&&(!st.only||r[3]>=20)&&(!st.cand||cd(r))}).sort(function(a,b){var x=stt(a)[1]==="go"?2:cd(a)?1:0,y=stt(b)[1]==="go"?2:cd(b)?1:0;return (LEV[a[0]]?1:0)-(LEV[b[0]]?1:0)||y-x||b[3]-a[3]});
 var cand=D.filter(function(r){return stt(r)[1]==="go"}).length,watch=D.filter(function(r){return stt(r)[1]==="boss"}).length,cheap=D.filter(function(r){return r[3]>=20}).length,exp=D.filter(function(r){return r[3]<=-33}).length;
 document.getElementById("sum").innerHTML='<div><b style="color:var(--accent)">'+cand+'</b><span>候選進場</span></div><div><b style="color:var(--warm)">'+watch+'</b><span>重點觀察</span></div><div><b>'+cheap+'</b><span>進入便宜區</span></div><div><b style="color:var(--hot)">'+exp+'</b><span>中貴以上</span></div>';
 var h="",seenLev=false;
 rows.forEach(function(r){
  var l=lv(r[3]),p=(r[3]+100)/2,f=r[7],s=stt(r),d="",lk=LEV[r[0]],pf=lk?"標的":"";if(lk&&!seenLev){h+='<div class="sec">槓桿型 ETF：分數與訊號以對應的一倍標的計算，不代表槓桿產品本身安全</div>';seenLev=true}
  f.forEach(function(v){d+='<i class="dt'+(v?" on":"")+'"></i>'});d+='<i class="dt bs'+(BOSS[r[0]]?" on":"")+'"></i>';
  var chips='<span class="fl bsf'+(BOSS[r[0]]?" on":"")+'">'+BN+(BOSS[r[0]]===2?"（形成中）":"")+'</span>';SN.forEach(function(n,k){chips+='<span class="fl'+(f[k]?" on":"")+'">'+n+'</span>'});
  h+='<div class="row'+(s[1]==="go"?" go":s[1]==="boss"?" boss":"")+(st.open===r[0]?" open":"")+'" tabindex="0" data-t="'+r[0]+'"><div class="id"><b>'+r[0]+'</b><span>'+r[1]+'</span>'+(lk?'<div class="lv">'+lk.x+' 倍・對應 '+lk.u+'</div>':'')+(lk&&lk.thin?'<div class="lv warn">資料不足，分數僅供參考</div>':'')+'<div class="sig"><span>'+d+'</span><em class="'+s[1]+'">'+s[0]+'</em></div></div>'
   +'<div class="sc"><b>'+r[3]+'</b><span style="color:'+l[1]+'">'+l[0]+'</span></div>'
   +'<div class="th"><i style="left:60%"></i><i style="left:75%"></i><i style="left:90%"></i><u style="left:'+p+'%"></u></div>'
   +'<div class="det"><div>'+pf+'距 52 週高點<b>'+r[4]+'%</b></div><div>'+pf+'日線 RSI<b>'+r[5]+'</b></div><div>'+pf+'相對 MA200<b>'+(r[6]>0?"+":"")+r[6]+'%</b></div>'
   +(lk?levBlock(lk):'')+'<div>轉折訊號（'+sum(f)+' / 5）<div class="sg" style="margin-top:4px">'+chips+'</div></div></div></div>';
 });
 document.getElementById("list").innerHTML=h||'<div class="empty">沒有符合條件的標的。</div>';
}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;st.m=b.dataset.m;[].forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x===b)});render()});
document.getElementById("only").addEventListener("change",function(){st.only=this.checked;render()});
document.getElementById("cand").addEventListener("change",function(){st.cand=this.checked;render()});
function tog(e){var r=e.target.closest(".row");if(!r)return;if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();st.open=st.open===r.dataset.t?null:r.dataset.t;render()}
document.getElementById("list").addEventListener("click",tog);
document.getElementById("list").addEventListener("keydown",tog);
render();
</script>
</body>
</html>
